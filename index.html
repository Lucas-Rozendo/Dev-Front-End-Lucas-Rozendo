<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body>
    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <main>
        <section class="controles" aria-labelledby="titulo-filtros">
            <h2 id="titulo-filtros">Filtro de buscas</h2>

            <label for="buscar-tarefa">Buscar Tarefa:</label>
            <input id="buscar-tarefa" type="search" name="buscar-tarefa">

            <fieldset>
                <legend>Prioridade</legend>

                <input type="radio" id="baixa" name="prioridade" value="baixa">
                <label for="baixa">Baixa</label>

                <input type="radio" id="media" name="prioridade" value="media">
                <label for="media">Média</label>

                <input type="radio" id="alta" name="prioridade" value="alta">
                <label for="alta">Alta</label>
            </fieldset>

            <fieldset>
                <legend>Status</legend>

                <input type="radio" id="a-fazer" name="status" value="a-fazer">
                <label for="a-fazer">A fazer</label>

                <input type="radio" id="em-andamento" name="status" value="em-andamento">
                <label for="em-andamento">Em andamento</label>

                <input type="radio" id="em-revisao" name="status" value="em-revisao">
                <label for="em-revisao">Em revisão</label>

                <input type="radio" id="concluidas" name="status" value="concluida">
                <label for="concluidas">Concluídas</label>
            </fieldset>
        </section>

        <div id="status-tarefas" class="estado-tela" role="status" aria-live="polite"></div>

        <div id="quadro-tarefas" class="quadro-tarefas" aria-busy="false">
            <section aria-labelledby="titulo-a-fazer">
                <h2 id="titulo-a-fazer">A fazer</h2>
                <ul id="lista-a-fazer" data-lista-status="a-fazer"></ul>
            </section>

            <section aria-labelledby="titulo-em-andamento">
                <h2 id="titulo-em-andamento">Em andamento</h2>
                <ul id="lista-em-andamento" data-lista-status="em-andamento"></ul>
            </section>

            <section aria-labelledby="titulo-em-revisao">
                <h2 id="titulo-em-revisao">Em revisão</h2>
                <ul id="lista-em-revisao" data-lista-status="em-revisao"></ul>
            </section>

            <section aria-labelledby="titulo-concluidas">
                <h2 id="titulo-concluidas">Concluídas</h2>
                <ul id="lista-concluidas" data-lista-status="concluida"></ul>
            </section>
        </div>
    </main>

    <footer>
        <p>Lucas Gabriel Rozendo da Silva — Desenvolvimento Frontend</p>
    </footer>
</body>
</html>
